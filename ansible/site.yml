# Playbook principal da VM Be Safe SOC Lab
- name: Be Safe SOC Lab
  hosts: all
  become: true
  roles:
    - base
    - branding
    - wazuh
    # depois do Wazuh: integra os alertas do Suricata no ossec.conf
    - ferramentas
    # antes do treinamento: ele marca todos os icones da area de trabalho como confiaveis
    - console
    - treinamento
    - primeiro_boot
