# Sistema base: usuario do aluno, desktop XFCE, guest tools e firewall

- name: pacotes basicos
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - jq
      - unzip
      - ufw
      - python3-pil
    state: present
    update_cache: true
  # espelhos (Ubuntu, Mozilla) as vezes estao no meio de uma sincronizacao
  register: apt_resultado
  until: apt_resultado is succeeded
  retries: 5
  delay: 30

- name: desktop XFCE minimo (Xubuntu core)
  ansible.builtin.apt:
    name:
      - xubuntu-core
      - lightdm
      - lightdm-gtk-greeter
      - xfce4-terminal
      # editor de texto usado nos labs (caderno de anotacoes, regras YARA e Sigma)
      - mousepad
      - virtualbox-guest-x11
      - open-vm-tools-desktop
    state: present
  when: besafe_desktop | bool

# Firefox .deb da Mozilla: o snap do Ubuntu nao abre arquivos fora da home (CyberChef
# fica em /opt) e tenta se atualizar sozinho numa VM que e offline
- name: chave do repositorio da Mozilla
  ansible.builtin.get_url:
    url: https://packages.mozilla.org/apt/repo-signing-key.gpg
    dest: /etc/apt/keyrings/packages.mozilla.org.asc
    mode: "0644"
  when: besafe_desktop | bool

- name: repositorio da Mozilla
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/mozilla.list
    mode: "0644"
    content: "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main\n"
  when: besafe_desktop | bool

- name: preferir o Firefox da Mozilla ao pacote de transicao do snap
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/mozilla
    mode: "0644"
    content: |
      Package: *
      Pin: origin packages.mozilla.org
      Pin-Priority: 1000
  when: besafe_desktop | bool

- name: remover Firefox snap
  community.general.snap:
    name: firefox
    state: absent
  failed_when: false
  when: besafe_desktop | bool

- name: Firefox .deb em portugues
  ansible.builtin.apt:
    name: [firefox, firefox-l10n-pt-br]
    state: latest
    update_cache: true
    # o pacote de transicao do Ubuntu tem epoca "1:", maior que a versao da Mozilla
    allow_downgrade: true
  when: besafe_desktop | bool
  # espelhos (Ubuntu, Mozilla) as vezes estao no meio de uma sincronizacao
  register: apt_resultado
  until: apt_resultado is succeeded
  retries: 5
  delay: 30

# sem termos de uso, telemetria ou boas-vindas (VM offline e de treino), treinamento como
# pagina inicial e favoritos para as ferramentas
- name: diretorio de politicas do Firefox
  ansible.builtin.file:
    path: /etc/firefox/policies
    state: directory
    mode: "0755"
  when: besafe_desktop | bool

- name: politicas do Firefox
  ansible.builtin.template:
    src: firefox-policies.json.j2
    dest: /etc/firefox/policies/policies.json
    mode: "0644"
  when: besafe_desktop | bool

- name: iniciar em modo grafico
  ansible.builtin.command: systemctl set-default graphical.target
  register: alvo
  changed_when: "'Created symlink' in alvo.stderr"
  when: besafe_desktop | bool

- name: usuario do aluno
  ansible.builtin.user:
    name: "{{ besafe_usuario }}"
    comment: Analista N1
    shell: /bin/bash
    groups: [sudo]
    append: true
    password: "{{ besafe_senha_inicial | password_hash('sha512', 'besafesalt') }}"
    update_password: on_create

# SSH liberado so durante o build; packer/scripts/limpeza.sh remove a regra
- name: liberar SSH do build
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    comment: build
  when: besafe_firewall | bool

- name: firewall nega entrada por padrao (servicos so em localhost)
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
  when: besafe_firewall | bool
