# Identidade visual Be Safe: boot, login, desktop, terminal e Wazuh
# As artes sao geradas na propria maquina a partir de branding/src/pantera.webp

- name: pacotes de tema
  ansible.builtin.apt:
    name:
      - plymouth
      - plymouth-themes
      - lightdm-gtk-greeter
      - papirus-icon-theme
      - fonts-dejavu-core
      - gnome-themes-extra
    state: present
    update_cache: true
  when: besafe_desktop | bool

- name: gerar artes a partir da pantera
  ansible.builtin.command:
    cmd: python3 build_assets.py
    chdir: "{{ branding_src }}"
    creates: "{{ branding_src }}/out/pantera.png"

- name: diretorio das artes
  ansible.builtin.file:
    path: "{{ branding_dir }}"
    state: directory
    mode: "0755"

- name: copiar artes geradas
  ansible.builtin.copy:
    src: "{{ branding_src }}/out/"
    dest: "{{ branding_dir }}/"
    mode: "0644"

- name: instalar fontes Orbitron e Rajdhani (OFL)
  ansible.builtin.copy:
    src: "{{ branding_src }}/fonts/"
    dest: /usr/local/share/fonts/besafe/
    mode: "0644"
  register: fontes

- name: atualizar cache de fontes
  ansible.builtin.command: fc-cache -f
  when: fontes.changed
  changed_when: true

- name: boot, login e desktop
  ansible.builtin.include_tasks: desktop.yml
  when: besafe_desktop | bool

# Terminal e SSH
- name: banner de login
  ansible.builtin.template:
    src: 10-besafe-motd.j2
    dest: /etc/update-motd.d/10-besafe
    mode: "0755"

- name: silenciar mensagens padrao do Ubuntu no login
  ansible.builtin.file:
    path: "/etc/update-motd.d/{{ item }}"
    mode: "0644"
  loop: [00-header, 10-help-text, 50-motd-news, 50-landscape-sysinfo, 91-release-upgrade, 91-contract-ua-esm-status]
  failed_when: false

- name: esvaziar motd padrao
  ansible.builtin.copy:
    dest: /etc/motd
    content: ""
    mode: "0644"

- name: prompt rosa
  ansible.builtin.copy:
    src: besafe-prompt.sh
    dest: /etc/profile.d/besafe-prompt.sh
    mode: "0644"

- name: identificacao no console
  ansible.builtin.copy:
    dest: /etc/issue
    mode: "0644"
    content: |
      Be Safe SOC Lab {{ besafe_versao }}  \l
      Powered By Mariana BS

# Wazuh dashboard
- name: identidade no Wazuh dashboard
  ansible.builtin.blockinfile:
    path: "{{ wazuh_dashboard_conf }}"
    marker: "# {mark} BE SAFE BRANDING"
    block: "{{ lookup('ansible.builtin.template', 'opensearch_dashboards-branding.yml.j2') }}"
  when: aplicar_branding_wazuh | bool
  notify: reiniciar wazuh dashboard
